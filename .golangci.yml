version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - (io/fs.File).Close
        - (*compress/gzip.Reader).Close
        - (*debug/elf.File).Close

formatters:
  enable:
    - gofmt
